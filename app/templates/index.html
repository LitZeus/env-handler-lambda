<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENV Manager</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <h1>Environment Variables</h1>
            <p>Manage your AWS S3 environment configuration securely</p>
        </header>

        <main>
            <div class="editor-container">
                <textarea id="envs" spellcheck="false" placeholder="Loading..."></textarea>
            </div>
            
            <div class="actions">
                <button id="save-btn" onclick="save()">
                    <span class="btn-text">Save Changes</span>
                    <span class="loader" id="loader"></span>
                </button>
            </div>
            
            <div id="toast" class="toast">Settings saved successfully!</div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
